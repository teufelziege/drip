name: Build and test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt build dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qmake6 build-essential python3
      - name: Build
        run: ./bin/build
      - name: Run counter tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
